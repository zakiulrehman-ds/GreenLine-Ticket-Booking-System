<div class="container py-4 mb-5">
    <h2 class="mb-4">My Bookings</h2>

    <div class="bus-card bg-white p-3 p-md-4 rounded-3 border shadow-sm">
    <div class="row align-items-center g-3">
        <div class="col-12 col-md-3">

        </div>
        <div class="col-12 col-md-2 d-flex flex-wrap gap-2 justify-content-start justify-content-md-end align-items-center">
            <span class="badge bg-success bg-opacity-10 text-success border border-success px-2 py-1">Confirmed</span>
            <button class="btn btn-outline-danger btn-sm fw-medium cancel-btn" data-id="RL6PK93326">Cancel</button>
